<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa8dc" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#2d5f95"/>
      <stop offset="0.5" stop-color="#1b4378"/>
      <stop offset="1" stop-color="#2a5a8f"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.6" stop-color="#2a86d6"/>
      <stop offset="1" stop-color="#0a4a94"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="900" height="64" rx="6" fill="url(#bar)"/>
  <rect width="900" height="2" fill="#ffffff" opacity="0.5"/>

  <!-- Start orb -->
  <circle cx="40" cy="32" r="24" fill="url(#orb)" stroke="#ffffff" stroke-opacity="0.7">
    <animate attributeName="r" values="24;26;24" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(28 20)">
    <rect x="0" y="1" width="10" height="10" fill="#f25022"/>
    <rect x="12" y="0" width="10" height="10" fill="#7fba00"/>
    <rect x="0" y="13" width="10" height="10" fill="#00a4ef"/>
    <rect x="12" y="12" width="10" height="10" fill="#ffb900"/>
  </g>

  <!-- Taskbar buttons -->
  <g fill="url(#btn)" stroke="#ffffff" stroke-opacity="0.5">
    <rect x="90" y="10" width="130" height="44" rx="6"/>
    <rect x="228" y="10" width="130" height="44" rx="6"/>
    <rect x="366" y="10" width="130" height="44" rx="6"/>
    <rect x="504" y="10" width="130" height="44" rx="6"/>
  </g>
  <g font-size="14" fill="#ffffff" text-anchor="middle">
    <text x="155" y="37">☕ Java</text>
    <text x="293" y="37">🐍 Python</text>
    <text x="431" y="37">🤖 AI / ML</text>
    <text x="569" y="37">🚀 Projects</text>
  </g>

  <!-- System tray -->
  <rect x="690" y="10" width="190" height="44" rx="6" fill="#0d2d57" opacity="0.55"/>
  <text x="705" y="38" font-size="16" fill="#ffffff">🔊 📶</text>
  <text x="770" y="29" font-size="13" fill="#ffffff">Thanks for</text>
  <text x="770" y="46" font-size="13" fill="#ffffff">visiting! 💙</text>
</svg>
