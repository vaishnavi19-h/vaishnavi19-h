<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#d4e8fa"/>
      <stop offset="0.5" stop-color="#a5cdf0"/>
      <stop offset="1" stop-color="#dcefff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf3fb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f5a8"/>
      <stop offset="0.5" stop-color="#3fcf3f"/>
      <stop offset="0.5" stop-color="#1fae1f"/>
      <stop offset="1" stop-color="#4fdc4f"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dde4"/>
      <stop offset="1" stop-color="#f5f7fa"/>
    </linearGradient>
    <linearGradient id="closeBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a99a"/>
      <stop offset="0.5" stop-color="#d9442b"/>
      <stop offset="1" stop-color="#b3260f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#021a3d" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="10" width="860" height="410" rx="9" fill="url(#glass)" stroke="#6f9bc6"/>
  </g>
  <rect x="30" y="42" width="840" height="368" rx="3" fill="url(#body)" stroke="#6f9bc6"/>
  <text x="44" y="32" font-size="14" fill="#0b2a55">⚡ Skill_Progress.exe — System Performance Monitor</text>
  <rect x="826" y="14" width="42" height="20" rx="4" fill="url(#closeBtn)" stroke="#7a1a0a"/>
  <text x="841" y="29" font-size="14" font-weight="bold" fill="#fff">✕</text>

  <text x="50" y="76" font-size="13" fill="#44688f">Skill levels are calculated from hands-on project experience…</text>

  <!-- Row template: label x=50, track x=250 w=520, pct at x=790 -->
  <!-- Java 85 -->
  <text x="50" y="118" font-size="16" fill="#12335f">☕ Java</text>
  <rect x="250" y="102" width="520" height="22" rx="4" fill="url(#track)" stroke="#8aa3bd"/>
  <rect x="251" y="103" width="0" height="20" rx="3" fill="url(#green)">
    <animate attributeName="width" values="0;441;441" keyTimes="0;0.25;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="118" font-size="15" font-weight="600" fill="#12335f">85%  LVL 8</text>

  <!-- Spring Boot 80 -->
  <text x="50" y="164" font-size="16" fill="#12335f">🍃 Spring Boot</text>
  <rect x="250" y="148" width="520" height="22" rx="4" fill="url(#track)" stroke="#8aa3bd"/>
  <rect x="251" y="149" width="0" height="20" rx="3" fill="url(#green)">
    <animate attributeName="width" values="0;415;415" keyTimes="0;0.28;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="164" font-size="15" font-weight="600" fill="#12335f">80%  LVL 8</text>

  <!-- SQL / JDBC 80 -->
  <text x="50" y="210" font-size="16" fill="#12335f">🗄️ SQL / JDBC</text>
  <rect x="250" y="194" width="520" height="22" rx="4" fill="url(#track)" stroke="#8aa3bd"/>
  <rect x="251" y="195" width="0" height="20" rx="3" fill="url(#green)">
    <animate attributeName="width" values="0;415;415" keyTimes="0;0.31;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="210" font-size="15" font-weight="600" fill="#12335f">80%  LVL 8</text>

  <!-- Python 80 -->
  <text x="50" y="256" font-size="16" fill="#12335f">🐍 Python</text>
  <rect x="250" y="240" width="520" height="22" rx="4" fill="url(#track)" stroke="#8aa3bd"/>
  <rect x="251" y="241" width="0" height="20" rx="3" fill="url(#green)">
    <animate attributeName="width" values="0;415;415" keyTimes="0;0.34;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="256" font-size="15" font-weight="600" fill="#12335f">80%  LVL 8</text>

  <!-- AI / ML 75 -->
  <text x="50" y="302" font-size="16" fill="#12335f">🤖 AI / ML</text>
  <rect x="250" y="286" width="520" height="22" rx="4" fill="url(#track)" stroke="#8aa3bd"/>
  <rect x="251" y="287" width="0" height="20" rx="3" fill="url(#green)">
    <animate attributeName="width" values="0;389;389" keyTimes="0;0.37;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="302" font-size="15" font-weight="600" fill="#12335f">75%  LVL 7</text>

  <!-- NLP 70 -->
  <text x="50" y="348" font-size="16" fill="#12335f">💬 NLP</text>
  <rect x="250" y="332" width="520" height="22" rx="4" fill="url(#track)" stroke="#8aa3bd"/>
  <rect x="251" y="333" width="0" height="20" rx="3" fill="url(#green)">
    <animate attributeName="width" values="0;363;363" keyTimes="0;0.4;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="348" font-size="15" font-weight="600" fill="#12335f">70%  LVL 7</text>

  <!-- GenAI 65 -->
  <text x="50" y="394" font-size="16" fill="#12335f">✨ Generative AI</text>
  <rect x="250" y="378" width="520" height="22" rx="4" fill="url(#track)" stroke="#8aa3bd"/>
  <rect x="251" y="379" width="0" height="20" rx="3" fill="url(#green)">
    <animate attributeName="width" values="0;337;337" keyTimes="0;0.43;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="394" font-size="15" font-weight="600" fill="#12335f">65%  LVL 6</text>
</svg>
